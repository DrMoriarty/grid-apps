name: Build and Release Electron App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Build Environment
        run: npm run setup

      - name: Build Electron app
        env:
          SKIPNOT: '1' # no Apple notarization credentials in CI
        run: npm run build-nopublish

      - name: Build Electron app (mac x64)
        if: matrix.os == 'macos-latest'
        env:
          SKIPNOT: '1' # no Apple notarization credentials in CI
        run: npx electron-builder --mac --x64 --publish never

      - name: Display Build Artifacts
        run: ls -l dist

      - name: Upload Linux artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: build-linux
          path: dist/*.AppImage

      - name: Sha256 Mac artifact
        if: matrix.os == 'macos-latest'
        run: shasum -a 256 dist/*.dmg

      - name: Upload Mac artifact
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: build-mac
          path: dist/*.dmg

  create_release:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create release name
        run: node bin/github-getver.js "${{ github.event_name }}"

      - name: Download All Release Assets
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Display Downloaded Assets
        run: ls -ltR artifacts

      - name: Rename release assets
        env:
          TAG_NAME: ${{ env.TAG_NAME }}
        run: |
          cd artifacts
          zip -9 "KiriMoto-Ubuntu-x64-${TAG_NAME}.zip" KiriMoto-linux-x64.AppImage
          for f in KiriMoto-mac-*.dmg; do
            case "$f" in
              *arm64*) mv "$f" "KiriMoto-MacOS-arm-${TAG_NAME}.dmg" ;;
              *x64*)   mv "$f" "KiriMoto-MacOS-x64-${TAG_NAME}.dmg" ;;
            esac
          done
          ls -l

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
          draft: false
          prerelease: false
          files: artifacts/*
          fail_on_unmatched_files: true
