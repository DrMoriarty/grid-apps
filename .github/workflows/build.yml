name: Build and Release Electron App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Build Environment
        run: npm run setup

      - name: Build Electron app
        env:
          SKIPNOT: '1' # no Apple notarization credentials in CI
        run: npm run build-nopublish

      - name: Build Electron app (mac x64)
        if: matrix.os == 'macos-latest'
        env:
          SKIPNOT: '1' # no Apple notarization credentials in CI
        run: npx electron-builder --mac --x64 --publish never

      - name: Display Build Artifacts
        run: ls -l dist

      - name: Upload Linux artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: build-linux
          path: dist/*.AppImage

      - name: Sha256 Mac artifact
        if: matrix.os == 'macos-latest'
        run: shasum -a 256 dist/*.dmg

      - name: Upload Mac artifact
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: build-mac
          path: dist/*.dmg

      - name: Sha256 Windows artifacts
        if: matrix.os == 'windows-latest'
        shell: bash
        run: sha256sum dist/*.exe dist/*.zip

      - name: Upload Windows artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: build-windows
          path: |
            dist/*.exe
            dist/*.zip

  create_release:
    runs-on: ubuntu-latest
    needs: build

    steps:
      # Full history AND tags are needed to build the changelog range
      # (a default shallow checkout carries neither).
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release name
        run: node bin/github-getver.js "${{ github.event_name }}"

      - name: Download All Release Assets
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Display Downloaded Assets
        run: ls -ltR artifacts

      - name: Rename release assets
        env:
          # TAG_NAME is always v-prefixed (see bin/github-getver.js);
          # asset filenames carry the bare version, no `v`.
          TAG_NAME: ${{ env.TAG_NAME }}
        run: |
          VERSION="${TAG_NAME#v}"
          cd artifacts
          shopt -s nullglob
          # electron-builder names the AppImage with arch "x86_64" (not "x64")
          zip -9 "KiriMoto-Ubuntu-x64-${VERSION}.zip" KiriMoto-linux-x86_64.AppImage
          for f in KiriMoto-mac-*.dmg; do
            case "$f" in
              *arm64*) mv "$f" "KiriMoto-MacOS-arm-${VERSION}.dmg" ;;
              *x64*)   mv "$f" "KiriMoto-MacOS-x64-${VERSION}.dmg" ;;
            esac
          done
          for f in KiriMoto-win-*.exe KiriMoto-win-*.zip; do
            case "$f" in
              *.exe) mv "$f" "KiriMoto-Windows-x64-${VERSION}.exe" ;;
              *.zip) mv "$f" "KiriMoto-Windows-x64-${VERSION}.zip" ;;
            esac
          done
          ls -l

      - name: Generate release notes
        id: notes
        shell: bash
        env:
          TAG_REF: ${{ github.ref }}
        run: |
          # Notes are only derived for tag pushes; manual runs have no tag ref.
          if [[ "${TAG_REF}" != refs/tags/v* ]]; then
            echo "Not a tag push; skipping the manual notes body."
            echo "body_path=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version="${TAG_REF#refs/tags/v}"
          # `|| true` guards against pipefail when no other tag exists yet.
          previous_tag="$(git tag --sort=-v:refname | grep -v "^v${version}$" | head -1 || true)"

          if [ -z "${previous_tag}" ]; then
            # First release: no range to describe — let the auto-notes stand alone.
            echo "Found no previous tag; skipping the manual notes body."
            echo "body_path=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changelog range: ${previous_tag}..HEAD"
          log="$(git log "${previous_tag}..HEAD" --no-merges --pretty=format:'- %s (%h)')"
          if [ -z "${log}" ]; then
            # Tag re-push or empty range: nothing to list manually.
            echo "No commits between ${previous_tag} and HEAD; skipping the manual notes body."
            echo "body_path=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "## What's Changed"
            echo
            printf '%s\n' "${log}"
          } > release-notes.md
          echo "body_path=release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # v-prefixed for both triggers. For tag pushes the tag already
          # exists on HEAD and is reused; for workflow_dispatch the action
          # creates it on the build commit (github.sha) when missing.
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
          draft: false
          prerelease: false
          files: artifacts/*
          fail_on_unmatched_files: true
          # Auto-notes (full changelog, contributors) are appended below the
          # manual commit list when body_path is set.
          generate_release_notes: true
          body_path: ${{ steps.notes.outputs.body_path }}
